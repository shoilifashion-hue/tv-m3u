name: Update IPTV Playlist

on:
  # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

  # প্রতি ৬ ঘণ্টা পর পর অটো রান হবে
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run IPTV Scraper
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playlist.m3u playlist.json
          
          if git diff --staged --quiet; then
            echo "No changes found. Skipping commit."
          else
            git commit -m "Auto-update IPTV playlist [$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M %p BST')]"
            git push
          fi
